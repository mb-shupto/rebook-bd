services:
  - type: web
    name: rebook-bd-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rebook-bd-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false   # set this manually after Vercel deploy

databases:
  - name: rebook-bd-db
    databaseName: rebook_bd
    plan: free
